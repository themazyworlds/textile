[project]
name = "textile"
version = "0.1.0"
description = "Textile • Modular AI Subsystem & Desktop Intelligence Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "themazyworlds", email = "meerahemant9086@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.10.0",
    "pyee>=13.0.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.15.0",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dbus = ["dbus-fast>=5.0.22"]
weave = ["livekit-agents[google,mcp]>=1.8.2"]
twill = ["mcp>=1.3.0"]
screen_vision = ["mss>=10.2.0", "pillow>=12.3.0"]
clipboard = ["pyxclip>=0.2.3"]
all = [
    "dbus-fast>=5.0.22",
    "livekit-agents[google,mcp]>=1.8.2",
    "mcp>=1.3.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyxclip>=0.2.3",
]

[project.scripts]
textile = "textile.core.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*unix_signal_add_full.*",
    "ignore:.*GLib.*deprecated.*",
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.uv.build-backend]
source-include = ["tests/**", "AGENTS.md"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "refurb>=2.3.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports & undefined names)
    "I",      # isort
    "UP",     # pyupgrade (modern Python syntax)
    "BLE",    # blind-except
    "S",      # flake8-bandit (security checks)
    "PL",     # Pylint
    "SIM",    # flake8-simplify
    "ERA",    # eradicate (commented-out dead code)
    "ARG",    # flake8-unused-arguments
    "PIE",    # flake8-pie
    "C901",   # mccabe cyclomatic complexity
    "N",      # pep8-naming
]
extend-select = ["A"]
ignore = ["S603", "S606", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-returns = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "S108",
    "ARG",
    "PLC0415",
    "PLR2004",
    "PLR0913",
    "PLR0915",
    "E501",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
