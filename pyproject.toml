[project]
name = "textile"
version = "0.1.0"
description = "Textile • Modular AI Subsystem & Desktop Intelligence Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "themazyworlds", email = "meerahemant9086@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.10.0",
    "pyee>=13.0.0",
    "rich>=15.0.0",
    "typer>=0.15.0",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dbus = ["dbus-fast>=5.0.22"]
weave = ["livekit-agents[google,mcp]>=1.8.2"]
twill = ["mcp>=1.3.0"]
screen_vision = ["mss>=10.2.0", "pillow>=12.3.0"]
clipboard = ["pyxclip>=0.2.3"]
all = [
    "dbus-fast>=5.0.22",
    "livekit-agents[google,mcp]>=1.8.2",
    "mcp>=1.3.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyxclip>=0.2.3",
]

[project.scripts]
textile = "textile.core.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*unix_signal_add_full.*",
    "ignore:.*GLib.*deprecated.*",
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.uv.build-backend]
source-include = ["tests/**", "AGENTS.md"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "radon>=6.0.1",
    "ruff>=0.16.8",
    "sourcery>=1.46.0",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "S", "PL", "SIM"]
extend-select = ["A", "N"]
ignore = ["S603", "S606", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLC0415", "PLR2004", "PLR0913", "PLR0915", "E501"]

[tool.ruff.lint.pylint]
max-returns = 10

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Linux"

[tool.vulture]
min_confidence = 80
paths = ["src/textile"]
exclude = ["tests/"]
ignore_decorators = [
    "@mcp.*",
    "@app.*",
    "@server.*",
    "@property",
    "@*.setter",
    "@strand*",
    "@weft*",
]
ignore_names = [
    "model_config",
    "handle_*",
    "on_*",
    "cmd_*",
    "hyprland_*",
    "caelestia_*",
    "canvas_*",
    "packagekit_*",
    "process_*",
    "sensors_*",
    "timer_*",
    "uwsm_*",
    "file_*",
    "inotify_*",
    "polkit_*",
    "dbus_*",
    "journal_*",
    "storage_*",
    "clipboard_*",
    "model_settings",
]
